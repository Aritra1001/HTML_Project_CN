<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact us</title>
  </head>
  <body>
    <!-- HEADER -->
    <header>
      <a href="./index.html"
        ><img src="../Multimedia/new_cn_logo.svg" alt="cn_logo"
      /></a>
    </header>
    <hr />

    <!-- CONTACT DETAILS -->
    <section id="contact-info">
      <h2>Contact Details</h2>
      <p>For inquiries, you can reach us via email or phone</p>
      <p>
        Email:
        <a href="mailto:contact@codingninja.com">contact@codingninja.com</a>
      </p>
      <p>Phone: <a href="tel:1800-123-3567">1800-123-3567</a></p>
    </section>
    <hr />

    <!-- LOCATION -->
    <section id="location">
      <h2>Location Map</h2>
      <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3499.603481507998!2d77.13265777550521!3d28.701505680945193!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x390d03d1c7d6aaab%3A0x62f148aa1c4a1838!2sCoding%20Ninjas!5e0!3m2!1sen!2sin!4v1744656302821!5m2!1sen!2sin"
        width="600"
        height="450"
        style="border: 0"
        allowfullscreen=""
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
      ></iframe>
    </section>
    <hr />

    <!-- FEEDBACK FORM -->
    <section id="feedback-form">
      <form action="#" method="post">
        <fieldset>
          <legend>Feedback Form</legend>
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" />
          <br />
          <br />
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" />
          <br />
          <br />
          <label for="subject">Subject:</label>
          <input type="text" id="subject" name="subject" />
          <br />
          <br />
          <label for="message">Message:</label>
          <textarea id="message" name="message" cols="20" rows="5"></textarea>
          <br />
          <br />
          <button type="submit">Submit</button>
        </fieldset>
      </form>
    </section>
  </body>
</html>
