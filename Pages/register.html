<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register Page</title>
  </head>
  <body>
    <!-- HEADER -->
    <header>
      <a href="./index.html"
        ><img src="../Multimedia/new_cn_logo.svg" alt="cn_logo"
      /></a>
      <h1>Create an Account</h1>
    </header>

    <!-- Registration form -->
    <section id="registration-form">
      <form action="#" method="post">
        <fieldset>
          <legend>Personal Information</legend>
          <br />
          <label for="full-name">Full Name:</label>
          <input type="text" id="full-name" name="full-name" required />
          <br />
          <br />
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required />
          <br /><br />
          <label for="username">Username:</label>
          <input type="text" id="username" name="username" required />
          <br /><br />
          <label for="password">Password:</label>
          <input type="password" id="password" name="password" required />
          <br /><br />
          <label for="user-type">User Type:</label>
          <select id="user-type" name="user-type" required>
            <option value="" disabled selected>Select user type</option>
            <option value="student">Student</option>
            <option value="instructor">Instructor</option>
          </select>
          <br /><br />
          <label for="course"> Select Course: </label>
          <select id="course" name="course" required>
            <option value="course1">Course 1 - web Development</option>
            <option value="course2">Course 2 - Data Science</option>
            <option value="course3">
              Course 3 - Digital Marketing Mastery
            </option>
            <option value="course4">Course 4 - Android Development</option>
          </select>
          <br />
          <br />
          <button type="submit">Register</button>
        </fieldset>
      </form>
    </section>
  </body>
</html>
